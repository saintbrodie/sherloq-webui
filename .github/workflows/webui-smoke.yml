name: WebUI smoke test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-web.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q web tests
      - name: Check optional worker isolation
        run: |
          python -c "from web.noiseprint_worker import app; assert app.title == 'Sherloq Noiseprint Worker'"
          python -c "from web.median_worker import app; assert app.title == 'Sherloq Median Filter Worker'"
      - name: Check browser JavaScript
        run: |
          node --check web/static/app.js
          node --check web/static/advanced-tools.js
          node --check web/static/plugin-runtime.js
          node --check web/static/plots.js
          node --check web/static/utility-tools.js
          node --check web/static/ela-tools.js
          node --check web/static/external-tools.js
          node --check web/static/history.js
      - name: Run API smoke tests
        run: pytest -q
      - name: Validate Compose configurations
        run: |
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.noiseprint.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.median.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.noiseprint.yml -f docker-compose.median.yml config >/dev/null
      - name: Build base container
        run: docker build -t sherloq-webui:test .
      - name: Verify base container is non-root
        run: test "$(docker run --rm sherloq-webui:test id -u)" != "0"
