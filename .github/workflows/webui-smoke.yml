name: WebUI smoke test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-web.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q web tests scripts
      - name: Check optional worker isolation
        run: |
          python -c "from web.noiseprint_worker import app; assert app.title == 'Sherloq Noiseprint Worker'"
          python -c "from web.median_worker import app; assert app.title == 'Sherloq Median Filter Worker'"
          python -c "from web.trufor_worker import app; assert app.title == 'Sherloq TruFor Worker'"
      - name: Check browser JavaScript
        run: |
          node --check web/static/app.js
          node --check web/static/advanced-tools.js
          node --check web/static/plugin-runtime.js
          node --check web/static/plots.js
          node --check web/static/utility-tools.js
          node --check web/static/ela-tools.js
          node --check web/static/external-tools.js
          node --check web/static/session-tools.js
          node --check web/static/history.js
          node --check web/static/ux-polish.js
          node --check web/static/hex-viewer.js
      - name: Verify consolidated Docker targets drop root
        run: |
          grep -q '^FROM python:3.12-slim AS webui$' docker/Dockerfile
          grep -q '^FROM python:3.11-slim AS noiseprint$' docker/Dockerfile
          grep -q '^FROM python:3.11-slim AS median$' docker/Dockerfile
          grep -q '^FROM pytorch/pytorch:1.11.0-cuda11.3-cudnn8-runtime AS trufor$' docker/Dockerfile
          grep -q '^USER sherloq$' docker/Dockerfile
          grep -q '^USER sherloq-noiseprint$' docker/Dockerfile
          grep -q '^USER sherloq-median$' docker/Dockerfile
          grep -q '^USER sherloq-trufor$' docker/Dockerfile
      - name: Run API smoke tests
        run: pytest -q
      - name: Validate Compose profiles
        run: |
          docker compose config >/dev/null
          docker compose --profile noiseprint config >/dev/null
          docker compose --profile median config >/dev/null
          docker compose --profile trufor config >/dev/null
          docker compose --profile noiseprint --profile median --profile trufor config >/dev/null
          docker compose -f compose.yaml -f compose.gpu.yaml --profile trufor config >/dev/null
      - name: Build base container
        run: docker build -f docker/Dockerfile --target webui -t sherloq-webui:test .
      - name: Verify base container is non-root
        run: test "$(docker run --rm sherloq-webui:test id -u)" != "0"
