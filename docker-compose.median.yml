services:
  sherloq-webui:
    environment:
      SHERLOQ_MEDIAN_URL: http://median-filter:8103
    depends_on:
      median-filter:
        condition: service_healthy

  median-filter:
    build:
      context: .
      dockerfile: Dockerfile.median
    expose:
      - "8103"
    environment:
      SHERLOQ_MAX_UPLOAD_MB: "40"
      SHERLOQ_MEDIAN_MAX_BLOCKS: "4096"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
