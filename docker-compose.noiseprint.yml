services:
  sherloq-webui:
    environment:
      SHERLOQ_NOISEPRINT_URL: http://noiseprint:8101
    depends_on:
      noiseprint:
        condition: service_healthy

  noiseprint:
    build:
      context: .
      dockerfile: Dockerfile.noiseprint
    expose:
      - "8101"
    environment:
      SHERLOQ_MAX_UPLOAD_MB: "40"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
