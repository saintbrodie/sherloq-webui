name: sherloq

services:
  sherloq-webui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: webui
    ports:
      - "${SHERLOQ_PORT:-8000}:8000"
    environment:
      SHERLOQ_MAX_UPLOAD_MB: "${SHERLOQ_MAX_UPLOAD_MB:-40}"
      SHERLOQ_SESSION_TTL_HOURS: "${SHERLOQ_SESSION_TTL_HOURS:-12}"
      SHERLOQ_BASIC_AUTH_USER: "${SHERLOQ_BASIC_AUTH_USER:-}"
      SHERLOQ_BASIC_AUTH_PASSWORD: "${SHERLOQ_BASIC_AUTH_PASSWORD:-}"
      # These internal URLs are always declared. Model-service discovery probes
      # worker health, so tools stay disabled unless their profile is running.
      SHERLOQ_NOISEPRINT_URL: http://noiseprint:8101
      SHERLOQ_MEDIAN_URL: http://median-filter:8103
      SHERLOQ_TRUFOR_URL: http://trufor:8102
    restart: unless-stopped

  noiseprint:
    profiles: ["noiseprint"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: noiseprint
    expose:
      - "8101"
    environment:
      SHERLOQ_MAX_UPLOAD_MB: "${SHERLOQ_MAX_UPLOAD_MB:-40}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  median-filter:
    profiles: ["median"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: median
    expose:
      - "8103"
    environment:
      SHERLOQ_MAX_UPLOAD_MB: "${SHERLOQ_MAX_UPLOAD_MB:-40}"
      SHERLOQ_MEDIAN_MAX_BLOCKS: "${SHERLOQ_MEDIAN_MAX_BLOCKS:-4096}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  trufor:
    profiles: ["trufor"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: trufor
    expose:
      - "8102"
    environment:
      SHERLOQ_MAX_UPLOAD_MB: "${SHERLOQ_MAX_UPLOAD_MB:-40}"
      SHERLOQ_TRUFOR_ROOT: /opt/trufor
      SHERLOQ_TRUFOR_WEIGHTS: /opt/trufor/test_docker/weights/trufor.pth.tar
      SHERLOQ_TRUFOR_GPU: "${SHERLOQ_TRUFOR_GPU:--1}"
      SHERLOQ_TRUFOR_TIMEOUT_SECONDS: "${SHERLOQ_TRUFOR_TIMEOUT_SECONDS:-900}"
    volumes:
      - "${SHERLOQ_TRUFOR_ROOT:-./TruFor}:/opt/trufor:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
